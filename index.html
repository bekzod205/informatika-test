<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Informatika metodikasi — Musobaqa</title>
<style>
:root{
  --bg:#0f1530;--card:#1a2247;--tx:#eef1ff;--mu:#9aa6d6;
  --ac:#6c8cff;--g:#22c55e;--b:#3b82f6;--y:#facc15;--r:#ef4444;
}
@media(prefers-color-scheme:light){
  :root{--bg:#eef2ff;--card:#fff;--tx:#14193a;--mu:#5b6595}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);
  font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100vh;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,20px);
}
main{max-width:600px;margin:0 auto;padding:14px 12px 60px}
.card{background:var(--card);border-radius:18px;padding:22px 18px;margin-bottom:14px;box-shadow:0 4px 24px #0003}
h1{font-size:clamp(20px,5vw,26px);line-height:1.3;margin-bottom:8px}
h2{font-size:clamp(15px,4vw,18px);line-height:1.4;margin-bottom:14px}
p{color:var(--mu);margin:5px 0;font-size:15px}
button,input{font:inherit;-webkit-appearance:none}
input{
  width:100%;padding:14px 16px;border-radius:13px;
  border:2px solid #7f8cc540;background:transparent;color:var(--tx);
  margin-bottom:6px;font-size:16px;
}
input:focus{outline:none;border-color:var(--ac)}
.btn{
  display:block;width:100%;padding:15px;border:0;border-radius:13px;
  background:var(--ac);color:#fff;font-size:17px;font-weight:700;
  cursor:pointer;touch-action:manipulation;
  transition:opacity .15s,transform .1s;margin-top:10px;
}
.btn:active{opacity:.82;transform:scale(.98)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.g{background:var(--g)}.btn.out{background:transparent;border:2px solid var(--ac);color:var(--ac)}
.opt{
  display:block;width:100%;text-align:left;margin:9px 0;padding:15px 14px;
  border-radius:13px;border:2px solid #7f8cc540;background:transparent;
  color:var(--tx);cursor:pointer;font:inherit;font-size:15px;line-height:1.5;
  touch-action:manipulation;transition:.15s;
}
.opt:hover{border-color:var(--ac)}
.opt.ok{background:var(--g)!important;border-color:var(--g)!important;color:#fff!important}
.opt.no{background:var(--r)!important;border-color:var(--r)!important;color:#fff!important}
.bar{height:8px;border-radius:8px;background:#7f8cc528;overflow:hidden;margin:8px 0 18px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.big{font-size:clamp(52px,13vw,72px);font-weight:800;text-align:center;line-height:1;margin:8px 0}
.ban{text-align:center;font-size:clamp(16px,4vw,21px);font-weight:800;padding:14px;border-radius:13px;margin-bottom:12px}
.win{background:#22c55e22;color:var(--g);animation:pop .6s}
.lose{background:#ef444422;color:var(--r);animation:shake .45s}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.sub{color:var(--mu);text-align:center;font-size:14px;margin:3px 0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px}
table{width:100%;border-collapse:collapse;min-width:280px}
th,td{padding:10px 8px;text-align:left;font-size:14px}
th{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #7f8cc522}
td{border-bottom:1px solid #7f8cc510}
tr:last-child td{border-bottom:none}
tr.r1{background:#22c55e18}tr.r1 td{font-weight:700;color:var(--g)}
tr.r2{background:#3b82f618}tr.r2 td{font-weight:700;color:var(--b)}
tr.r3{background:#facc1518}tr.r3 td{font-weight:700;color:var(--y)}
tr.me td:nth-child(2){text-decoration:underline dotted}
.dot{width:9px;height:9px;border-radius:50%;background:var(--r);display:inline-block;vertical-align:middle;margin-right:5px;transition:.3s}
.dot.on{background:var(--g);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sm{font-size:13px;color:var(--mu)}
.hide{display:none!important}
#fx{position:fixed;inset:0;pointer-events:none;z-index:99}
</style>
</head>

<canvas id="fx"></canvas>
<main>

    <button class="btn out" id="goHome" style="margin-top:8px">🏠 Bosh sahifa</button>
  </section>

  <!-- REYTING -->
  <section class="card">
    <div class="row">

      <span><span class="dot" id="dot"></span><span class="sm" id="connTxt">ulanmoqda…</span></span>

      <table>
        <thead><tr><th>#</th><th>Ism</th><th>Ball</th><th>Vaqt</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <p class="sm" id="lbn" style="margin-top:8px"></p>
  </section>

</main>

/* ============================================================
   FIREBASE REST API  (CDK, npm, sozlama kerak emas)
   ============================================================ */
async function fbRead(){
  try{
    const r = await fetch(DB+'/results.json?auth='+APIKEY, {cache:'no-store'});
    if(!r.ok) throw r.status;
    const d = await r.json();
    return d ? Object.entries(d).map(([id,v])=>({id,...v})) : [];
  }catch(e){ return null; }
}

async function fbWrite(data){
  try{
    const r = await fetch(DB+'/results/'+uid+'.json?auth='+APIKEY, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    return r.ok;
  }catch(e){ return false; }
}

/* ============================================================
   ULANISH
   ============================================================ */
function setConn(on){
  fbOK = on;
  $('#dot').classList.toggle('on', on);
  $('#connTxt').textContent = on ? '🟢 Jonli reyting' : '📴 Lokal rejim';
}

async function initDB(){
  const data = await fbRead();
  if(data !== null){
    setConn(true);
    rows = data;
    board();
    // Har 6 soniyada yangilab turadi
    clearInterval(pollInt);
    pollInt = setInterval(async()=>{
      const d = await fbRead();
      if(d !== null){ rows=d; board(); }
    }, 6000);
  } else {
    setConn(false);
    loadLocal();
  }
}

/* ============================================================
   LOCAL FALLBACK
   ============================================================ */
function loadLocal(){
  try{ rows = JSON.parse(localStorage.getItem('q_rows')||'[]'); }catch(e){ rows=[]; }
  board();
}
function saveLocal(){
  try{ localStorage.setItem('q_rows', JSON.stringify(rows)); }catch(e){}
}

/* ============================================================

function board(){
  rows.sort((a,b) => b.score-a.score || a.time-b.time);
  $('#cnt').textContent = rows.length;
  const tb = $('#tb');
  tb.innerHTML = '';
  if(!rows.length){
    $('#lbMsg').textContent = 'Hozircha natijalar yo\'q.';
    $('#lbMsg').classList.remove('hide');
    $('#tbWrap').classList.add('hide');
    return;
  }
  $('#lbMsg').classList.add('hide');
  $('#tbWrap').classList.remove('hide');
  rows.forEach((r,k)=>{
    const tr = document.createElement('tr');
    if(k<3) tr.className='r'+(k+1);
    if(r.id===uid) tr.classList.add('me');
    const medal = ['🥇','🥈','🥉'][k] || (k+1);
    [medal, r.name, r.score+' / 100', fmt(r.time)].forEach(v=>{
      const td = document.createElement('td');
      td.textContent = v;
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
}

/* ============================================================
   EKRAN ALMASHISH
   ============================================================ */
function show(id){
  ['home','quiz','res'].forEach(s => $('#'+s).classList.add('hide'));
  $('#'+id).classList.remove('hide');
  window.scrollTo(0,0);
}

/* ============================================================
   BOSHLASH
   ============================================================ */
$('#go').onclick = startQuiz;
$('#rt').onclick = startQuiz;
$('#goHome').onclick = () => show('home');
$('#nm').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#go').click(); });

function startQuiz(){
  const n = $('#nm').value.trim();
  if(n.length < 2){
    $('#nm').style.borderColor = 'var(--r)';
    setTimeout(()=>$('#nm').style.borderColor='', 1500);
    $('#nm').focus();
    return;
  }
  localStorage.setItem('q_name', n);
  quiz = sh(Q).slice(0,10).map(q=>{
    const opts = sh(q.o.map((t,k)=>({t, c:k===q.a})));
    return {q:q.q, opts};
  });
  qi=0; score=0; t0=Date.now(); busy=false;
  clearInterval(timerInt);
  timerInt = setInterval(()=>{
    $('#timer').textContent = '⏱ '+fmt(Math.round((Date.now()-t0)/1000));
  }, 500);
  show('quiz');
  showQ();
}

/* ============================================================
   SAVOL
   ============================================================ */
function showQ(){
  busy = false;
  const q = quiz[qi];
  $('#pg').textContent = `Savol ${qi+1} / 10  ·  Ball: ${score}`;
  $('#pb').style.width = (qi*10)+'%';
  $('#qt').textContent = q.q;
  const ops = $('#ops');
  ops.innerHTML = '';
  q.opts.forEach(o=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = o.t;
    b.onclick = () => pick(b, o, q.opts);
    ops.appendChild(b);
  });
}

function pick(b, o, opts){
  if(busy) return;
  busy = true;
  if(o.c){ score+=10; b.classList.add('ok'); }
  else{
    b.classList.add('no');
    $$('#ops .opt').forEach((x,k)=>{ if(opts[k].c) x.classList.add('ok'); });
  }
  setTimeout(()=>{ if(++qi < 10) showQ(); else finish(); }, 1000);
}

/* ============================================================
   YAKUNLASH
   ============================================================ */
async function finish(){
  clearInterval(timerInt);
  const elapsed = Math.round((Date.now()-t0)/1000);
  const name    = $('#nm').value.trim();
  const result  = {name, score, time:elapsed, ts:Date.now()};
  show('res');

  const prev   = rows.find(x=>x.id===uid);
  const better = !prev || score>prev.score || (score===prev.score && elapsed<prev.time);

  showResult(result, better ? result : prev);

  if(better){
    if(fbOK){
      const ok = await fbWrite(result);
      if(ok){
        // Reytingni darhol yangilash
        setTimeout(async()=>{
          const d = await fbRead();
          if(d){ rows=d; board(); }
        }, 800);
      } else {
        $('#lbn').textContent = '⚠️ Serverga yozilmadi — lokal saqlandi.';
        saveLocalResult(result);
      }
    } else {
      saveLocalResult(result);
    }
  }
}

function saveLocalResult(r){
  rows = rows.filter(x=>x.id!==uid);
  rows.push({id:uid, ...r});
  saveLocal();
  board();
}

/* ============================================================
   NATIJA EKRANI
   ============================================================ */
function showResult(r, best){
  const w = r.score >= 60;
  const ban = $('#ban');
  ban.className = 'ban '+(w?'win':'lose');
  ban.textContent = w ? '🎉 Tabriklaymiz! Testdan o\'tdingiz!' : '😔 Yutqazdingiz. Qayta urinib ko\'ring!';
  $('#sc').textContent = r.score+' / 100';
  $('#tm').textContent = '⏱ Sarflangan vaqt: '+fmt(r.time);
  $('#bs').textContent = '⭐ Eng yaxshi natijangiz: '+(best?best.score:r.score)+' / 100  ('+fmt(best?best.time:r.time)+')';
  if(w) confetti(); else rain();
}

/* ============================================================
   EFFEKTLAR
   ============================================================ */
function confetti(){
  const c=$('#fx'), x=c.getContext('2d');
  c.width=innerWidth; c.height=innerHeight;
  const P=Array.from({length:220},()=>({
    x:Math.random()*c.width, y:-30-Math.random()*c.height*.5,
    v:2.5+Math.random()*4, s:6+Math.random()*9,
    h:Math.random()*360, r:Math.random()*6, w:Math.random()*2-1
  }));
  let f=0;
  (function L(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{
      p.y+=p.v; p.r+=.1; p.x+=p.w;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r);
      x.fillStyle=`hsl(${p.h} 90% 60%)`;
      x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      x.restore();
    });
    if(++f<420) requestAnimationFrame(L);
    else x.clearRect(0,0,c.width,c.height);
  })();
}

function rain(){
  const c=$('#fx'), x=c.getContext('2d');
  c.width=innerWidth; c.height=innerHeight;
  const P=Array.from({length:55},()=>({
    x:Math.random()*c.width, y:-Math.random()*c.height*.4, v:2+Math.random()*3
  }));
  let f=0;
  (function L(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{ p.y+=p.v; x.font='20px serif'; x.fillText('💧',p.x,p.y); });
    if(++f<230) requestAnimationFrame(L);
    else x.clearRect(0,0,c.width,c.height);
  })();
}

/* ============================================================
   ISHGA TUSHIRISH
   ============================================================ */
// Ismni eslab qolish
const savedName = localStorage.getItem('q_name');
if(savedName) $('#nm').value = savedName;

// Oldingi natijani ko'rsatish
const prevMe = rows.find(r=>r.id===uid);
if(prevMe) $('#info').textContent = `✅ Oldingi natijangiz: ${prevMe.score}/100`;

// Firebase ga ulaning
initDB();
</script>
